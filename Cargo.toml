[package]
name = "weavatrix-stream"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Bounded streaming interaction aggregates and sketches for Weavatrix and RadioChron"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/Weavatrix/weavatrix-stream"
readme = "README.md"
keywords = ["streaming", "sketch", "anomaly", "count-min", "no-std"]
categories = ["no-std", "algorithms", "science"]

[features]
default = []
std = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
